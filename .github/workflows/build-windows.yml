name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build single .exe
        run: pyinstaller --noconfirm --windowed --onefile --name OfflineParaphraser paraphraser_app.pyw
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: OfflineParaphraser-exe
          path: dist/OfflineParaphraser.exe
